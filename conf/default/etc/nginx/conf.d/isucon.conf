# ISUCON の初期設定（http コンテキスト）。apply.sh が /etc/nginx/conf.d/isucon.conf に置く。
# 過去問の演習（private-isu、isucon12 予選）の両方で採用し、サーバーの構成に依存しないものだけを入れた。

# G0: alp で集計するための LTSV。upstream は複数台にしたときにどの app が応答したかを、
# conn 以降の 3 項目は接続の使い回しと TLS のセッション再利用を見るため。
# nginx.conf の元の access_log は apply.sh がコメントアウトする（残すと 2 行ずつ記録される）。
log_format ltsv "time:$time_local"
                "\thost:$remote_addr"
                "\tforwardedfor:$http_x_forwarded_for"
                "\treq:$request"
                "\tmethod:$request_method"
                "\turi:$request_uri"
                "\tstatus:$status"
                "\tsize:$body_bytes_sent"
                "\treferer:$http_referer"
                "\tua:$http_user_agent"
                "\treqtime:$request_time"
                "\tapptime:$upstream_response_time"
                "\tupstream:$upstream_addr"
                "\tvhost:$host"
                "\tconn:$connection"
                "\tconnreqs:$connection_requests"
                "\tsslreused:$ssl_session_reused";
access_log /var/log/nginx/access.log ltsv buffer=64k flush=1s;

# open_file_cache は入れない。同じパスのファイルを書き換えるアプリ（アイコンの更新など）で、古い内容を返しうる。
# 演習で効いたのは、ファイル操作が遅い環境（colima の virtiofs）だけだった。静的ファイルが重いと計測でわかってから、
# worker_rlimit_nofile と必ずセットで入れる
